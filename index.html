
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Для Сашуни 💗</title>
<style>
* { box-sizing:border-box; }
body {
 margin:0; min-height:100vh;
 display:flex; align-items:center; justify-content:center;
 background:linear-gradient(135deg,#ffe5ef,#fff0f6,#ffd5e5);
 font-family:Arial,sans-serif; overflow:hidden;
}
.card {
 width:90%; max-width:390px; padding:30px 20px;
 background:white; border:6px solid #ffc1d8;
 border-radius:32px; text-align:center;
 box-shadow:0 12px 40px #d65b8c35;
 position:relative; z-index:2;
}
h1 { color:#d9437d; }
.cats { font-size:85px; margin:20px 0; }
p { color:#693d52; font-size:21px; font-weight:bold; }
button {
 border:0; border-radius:30px; padding:15px 30px;
 font-size:18px; margin:8px; cursor:pointer;
}
.yes { background:#f34e8c; color:white; }
.no { background:#eee5f0; color:#51465b; }
#success { display:none; }
.heart {
 position:fixed; bottom:-30px;
 animation:rise 6s linear forwards;
 pointer-events:none;
}
@keyframes rise {
 to { transform:translateY(-110vh) rotate(360deg);opacity:0; }
}
@keyframes pulse {
 50% { transform:scale(1.08); }
}
.cats { animation:pulse 2s infinite; }
</style>
</head>
<body>

<div class="card" id="invite">
 <h1>Для Сашуни 💌</h1>
 <div class="cats">🐱💕🐱</div>
 <p>Сашуня, ты пойдёшь со мной на свидание?</p>
 <button class="yes" onclick="accept()">Да ❤️</button>
 <button class="no" id="no" onclick="run()">Нет 🙈</button>
 <p style="font-size:13px;color:#d77b9e">
 У меня есть кое-что особенное для тебя...
 </p>
</div>

<div class="card" id="success">
 <div class="cats">🥰💗🌷</div>
 <h1>УРААА!</h1>
 <p>Я знал(а), что ты согласишься!</p>
 <p>Сашуня, ты делаешь этот мир прекраснее ❤️</p>
 <div style="font-size:45px">💋💞💋</div>
</div>

<script>
function accept() {
 document.getElementById('invite').style.display='none';
 document.getElementById('success').style.display='block';
}
function run() {
 const b=document.getElementById('no');
 b.style.position='fixed';
 b.style.left=Math.random()*65+'vw';
 b.style.top=Math.random()*75+'vh';
}
setInterval(()=>{
 const h=document.createElement('div');
 h.className='heart';
 h.textContent=['💗','💕','💖','🌸'][Math.floor(Math.random()*4)];
 h.style.left=Math.random()*100+'vw';
 h.style.fontSize=(18+Math.random()*20)+'px';
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),6000);
},500);
</script>

</body>
</html>
